<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Adventure Game - 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: #000;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: white;
            font-size: 14px;
            z-index: 10;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            backdrop-filter: blur(10px);
        }
        
        .stat.health {
            border-left-color: #f44336;
        }
        
        .stat.hunger {
            border-left-color: #FF9800;
        }
        
        .stat.energy {
            border-left-color: #2196F3;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .stat-bar {
            width: 150px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
            width: 100%;
        }
        
        .health .stat-fill {
            background: linear-gradient(90deg, #f44336, #FF6B6B);
        }
        
        .hunger .stat-fill {
            background: linear-gradient(90deg, #FF9800, #FFB74D);
        }
        
        .energy .stat-fill {
            background: linear-gradient(90deg, #2196F3, #64B5F6);
        }
        
        #actions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.5);
            background: linear-gradient(135deg, #2196F3, #0b7dda);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        #info-panel {
            position: absolute;
            top: 120px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            color: #4CAF50;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            max-width: 350px;
            font-size: 13px;
            z-index: 10;
            display: none;
            backdrop-filter: blur(10px);
            line-height: 1.6;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 5;
        }
        
        .crosshair-line {
            position: absolute;
            background: rgba(76, 175, 80, 0.6);
        }
        
        .crosshair-h {
            width: 20px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .crosshair-v {
            width: 1px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }
        
        #fps {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #4CAF50;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 10;
        }
        
        #controls-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #4CAF50;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4CAF50;
            font-size: 11px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        
        .control-line {
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        
        .control-key {
            background: rgba(76, 175, 80, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        
        <div id="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>
        
        <div id="ui">
            <div class="stat health">
                <div class="stat-label">❤️ SALUD</div>
                <div class="stat-bar">
                    <div class="stat-fill" id="health-bar" style="width: 100%"></div>
                </div>
            </div>
            
            <div class="stat hunger">
                <div class="stat-label">🍖 HAMBRE</div>
                <div class="stat-bar">
                    <div class="stat-fill" id="hunger-bar" style="width: 100%"></div>
                </div>
            </div>
            
            <div class="stat energy">
                <div class="stat-label">⚡ ENERGÍA</div>
                <div class="stat-bar">
                    <div class="stat-fill" id="energy-bar" style="width: 100%"></div>
                </div>
            </div>
        </div>
        
        <div id="info-panel">
            <div id="info-text"></div>
        </div>
        
        <div id="fps">FPS: 60</div>
        
        <div id="actions">
            <button class="action-btn" id="collect-btn">🌲 Recolectar (Q)</button>
            <button class="action-btn" id="craft-btn">🔨 Crafting (C)</button>
            <button class="action-btn" id="rest-btn">😴 Descansar (Z)</button>
            <button class="action-btn" id="hunt-btn">🏹 Cazar (F)</button>
        </div>
        
        <div id="controls-info">
            <div class="control-line">
                <span>Movimiento:</span>
                <span class="control-key">W A S D</span>
            </div>
            <div class="control-line">
                <span>Saltar:</span>
                <span class="control-key">ESPACIO</span>
            </div>
            <div class="control-line">
                <span>Correr:</span>
                <span class="control-key">SHIFT</span>
            </div>
            <div class="control-line">
                <span>Disparar:</span>
                <span class="control-key">CLICK</span>
            </div>
            <div class="control-line">
                <span>Apuntar:</span>
                <span class="control-key">RMB</span>
            </div>
            <div class="control-line">
                <span>Recargar:</span>
                <span class="control-key">R</span>
            </div>
            <div class="control-line">
                <span>Mirar:</span>
                <span class="control-key">RATÓN</span>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/3d-game.js"></script>
    <script src="js/3d-player.js"></script>
    <script src="js/3d-environment.js"></script>
    <script src="js/3d-interactions.js"></script>
</body>
</html>
